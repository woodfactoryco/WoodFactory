name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What the deploy needs: read the code, publish Pages, prove who it is.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` needs a package-lock.json. There is no lockfile in the repo yet
      # because this project was set up on a machine without Node. Once you have
      # run `npm install` locally and committed package-lock.json, switch the
      # line below to `npm ci` for faster, reproducible builds.
      - run: npm install

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
